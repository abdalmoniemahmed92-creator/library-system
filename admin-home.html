<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الرئيسية</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f8fafc; font-family: Tahoma, sans-serif;">

    <div style="display: flex; flex-direction: column; align-items: center; padding: 30px 20px; box-sizing: border-box; min-height: 100vh;">
        
        <div style="width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 12px; align-items: center;">

            <!-- العنوان الرئيسي -->
            <h2 style="color: #1f2937; margin-bottom: 5px; text-align: center;">لوحة التحكم</h2>
            <p style="color: #64748b; font-size: 13px; margin-top: 0; text-align: center;">إدارة النظام وصلاحيات المدير</p>

            <!-- أزرار الإدارة والتحكم -->
            <div style="display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 10px;">
                
                <button onclick="navigateTo('add-book.html')" style="width: 100%; background: white; color: #1f2937; border: none; border-radius: 15px; padding: 15px 20px; font-weight: bold; cursor: pointer; font-size: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center;">
                    <span>إضافة كتاب</span>
                    <span>📖</span>
                </button>

                <button onclick="navigateTo('add-thesis.html')" style="width: 100%; background: white; color: #1f2937; border: none; border-radius: 15px; padding: 15px 20px; font-weight: bold; cursor: pointer; font-size: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center;">
                    <span>إضافة رسالة جامعية</span>
                    <span>📜</span>
                </button>

                <!-- زر إدارة طلبات الإعارة والبث الانتقائي المربوط بالصفحة المطلوبة -->
                <button onclick="navigateTo('manage-requests.html')" style="width: 100%; background: white; color: #1f2937; border: none; border-radius: 15px; padding: 15px 20px; font-weight: bold; cursor: pointer; font-size: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center;">
                    <span>إدارة طلبات الإعارة والبث الانتقائي</span>
                    <span>📋</span>
                </button>

                <button onclick="navigateTo('edit-book.html')" style="width: 100%; background: white; color: #1f2937; border: none; border-radius: 15px; padding: 15px 20px; font-weight: bold; cursor: pointer; font-size: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center;">
                    <span>تعديل بيانات كتاب</span>
                    <span>✏️</span>
                </button>

                <button onclick="navigateTo('delete-thesis.html')" style="width: 100%; background: white; color: #1f2937; border: none; border-radius: 15px; padding: 15px 20px; font-weight: bold; cursor: pointer; font-size: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center;">
                    <span>حذف رسالة جامعية</span>
                    <span>🗑️</span>
                </button>

                <button onclick="navigateTo('reports.html')" style="width: 100%; background: white; color: #1f2937; border: none; border-radius: 15px; padding: 15px 20px; font-weight: bold; cursor: pointer; font-size: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center;">
                    <span>التقارير</span>
                    <span>📊</span>
                </button>

            </div>

            <!-- زر تسجيل الخروج -->
            <button onclick="logout()" style="width: 100%; background: #fee2e2; color: #dc2626; border: none; border-radius: 20px; padding: 12px; font-weight: bold; cursor: pointer; font-size: 14px; margin-top: 15px;">تسجيل الخروج</button>

        </div>
    </div>

    <!-- Firebase والسكربت البرمجي -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC-E9VX8n8ytdBh-xJvU9T94tgayv91O24",
            authDomain: "library-catalog-5d1ee.firebaseapp.com",
            databaseURL: "https://library-catalog-5d1ee-default-rtdb.firebaseio.com",
            projectId: "library-catalog-5d1ee",
            storageBucket: "library-catalog-5d1ee.firebasestorage.app",
            messagingSenderId: "208558639650",
            appId: "1:208558639650:web:564ef91d341bbb23ef587b",
            measurementId: "G-BHYSZHJLTR"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'login.html';
            }
        });

        window.navigateTo = function(pageUrl) {
            window.location.href = pageUrl;
        }

        window.logout = function() {
            signOut(auth).then(() => {
                window.location.href = 'login.html';
            }).catch((error) => {
                console.error("خطأ في تسجيل الخروج:", error);
            });
        }
    </script>
</body>
</html>
