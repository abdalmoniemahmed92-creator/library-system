<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدمة البث الانتقائي</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f1f5f9; font-family: Tahoma, sans-serif; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center;">

    <div style="width: 100%; max-width: 500px; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px;">

        <!-- العنوان الرئيسي -->
        <h2 style="color: #1e3a8a; margin: 0; text-align: center; font-size: 15px; font-weight: bold;">خدمة البث الانتقائي (SDI)</h2>

        <!-- نبذة تعريفيّة مصغرة -->
        <div style="background: white; padding: 6px 10px; border-radius: 6px; border: 2px solid #cbd5e1; text-align: center; width: 100%; box-sizing: border-box;">
            <p style="margin: 0; font-size: 10.5px; color: #1e293b; line-height: 1.3; font-weight: 600;">
                اشترك لتصلك أحدث الإصدارات والرسائل الجامعية في مجالك الأكاديمي مباشرة.
            </p>
        </div>

        <!-- نموذج الاشتراك -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: white; padding: 10px; border-radius: 6px; border: 2px solid #cbd5e1; box-sizing: border-box; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
            
            <div style="display: flex; flex-direction: column; gap: 2px;">
                <label style="font-size: 10px; color: #1e3a8a; font-weight: bold; text-align: right;">الاسم الكامل</label>
                <input type="text" id="fullName" placeholder="الاسم الكامل" style="background: #ffffff; border: 1.5px solid #94a3b8; border-radius: 4px; padding: 5px 8px; outline: none; font-size: 10.5px; text-align: right; color: #0f172a; width: 100%; box-sizing: border-box; font-weight: 600;">
            </div>

            <div style="display: flex; flex-direction: column; gap: 2px;">
                <label style="font-size: 10px; color: #1e3a8a; font-weight: bold; text-align: right;">رقم الهاتف</label>
                <input type="text" id="phone" placeholder="رقم الهاتف" style="background: #ffffff; border: 1.5px solid #94a3b8; border-radius: 4px; padding: 5px 8px; outline: none; font-size: 10.5px; text-align: right; color: #0f172a; width: 100%; box-sizing: border-box; font-weight: 600;">
            </div>

            <div style="display: flex; flex-direction: column; gap: 2px;">
                <label style="font-size: 10px; color: #1e3a8a; font-weight: bold; text-align: right;">البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="example@domain.com" style="background: #ffffff; border: 1.5px solid #94a3b8; border-radius: 4px; padding: 5px 8px; outline: none; font-size: 10.5px; text-align: right; color: #0f172a; width: 100%; box-sizing: border-box; font-weight: 600;">
            </div>

            <div style="display: flex; flex-direction: column; gap: 2px;">
                <label style="font-size: 10px; color: #1e3a8a; font-weight: bold; text-align: right;">التخصص / القسم</label>
                <select id="department" style="background: #ffffff; border: 1.5px solid #94a3b8; border-radius: 4px; padding: 5px 8px; outline: none; font-size: 10.5px; text-align: right; color: #0f172a; cursor: pointer; width: 100%; box-sizing: border-box; font-weight: 600;">
                    <option value="" disabled selected>اختر التخصص...</option>
                    <option value="علوم الحاسوب">علوم الحاسوب</option>
                    <option value="تقنية معلومات">تقنية معلومات</option>
                    <option value="هندسة برمجيات">هندسة برمجيات</option>
                    <option value="نظم معلومات إدارية">نظم معلومات إدارية</option>
                    <option value="نظم معلومات محاسبية">نظم معلومات محاسبية</option>
                    <option value="نظم معلومات المكتبات">نظم معلومات المكتبات</option>
                </select>
            </div>

            <div style="display: flex; flex-direction: column; gap: 2px;">
                <label style="font-size: 10px; color: #1e3a8a; font-weight: bold; text-align: right;">نوع المحتوى</label>
                <select id="contentType" style="background: #ffffff; border: 1.5px solid #94a3b8; border-radius: 4px; padding: 5px 8px; outline: none; font-size: 10.5px; text-align: right; color: #0f172a; cursor: pointer; width: 100%; box-sizing: border-box; font-weight: 600;">
                    <option value="الكل (كتب وريلائل جامعية)">الكل (كتب + رسائل)</option>
                    <option value="الكتب والإصدارات فقط">الكتب والإصدارات فقط</option>
                    <option value="الرسائل الجامعية فقط">الرسائل الجامعية فقط</option>
                </select>
            </div>

            <div style="display: flex; flex-direction: column; gap: 2px;">
                <label style="font-size: 10px; color: #1e3a8a; font-weight: bold; text-align: right;">طريقة الاستلام</label>
                <select id="notificationChannel" style="background: #ffffff; border: 1.5px solid #94a3b8; border-radius: 4px; padding: 5px 8px; outline: none; font-size: 10.5px; text-align: right; color: #0f172a; cursor: pointer; width: 100%; box-sizing: border-box; font-weight: 600;">
                    <option value="البريد الإلكتروني">البريد الإلكتروني</option>
                    <option value="رقم الهاتف">رقم الهاتف</option>
                    <option value="كلاهما">كلاهما</option>
                </select>
            </div>

            <div style="grid-column: span 2; display: flex; flex-direction: column; gap: 2px;">
                <label style="font-size: 10px; color: #1e3a8a; font-weight: bold; text-align: right;">كلمات مفتاحية أو موضوعات الاهتمام</label>
                <textarea id="interests" rows="1" placeholder="مثال: الذكاء الاصطناعي، قواعد البيانات..." style="background: #ffffff; border: 1.5px solid #94a3b8; border-radius: 4px; padding: 5px 8px; outline: none; font-size: 10.5px; text-align: right; resize: none; font-family: Tahoma, sans-serif; color: #0f172a; width: 100%; box-sizing: border-box; font-weight: 600;"></textarea>
            </div>

            <!-- الأزرار بألوان قوية وبارزة -->
            <div style="grid-column: span 2; display: flex; gap: 6px; margin-top: 2px;">
                <button id="submitBtn" onclick="submitSubscription()" style="flex: 1; background: #1e3a8a; color: white; border: none; border-radius: 4px; padding: 7px; font-weight: bold; cursor: pointer; font-size: 11px; box-shadow: 0 2px 4px rgba(30,58,138,0.3);">إشتراك في الخدمة</button>
                <button onclick="navigateTo('service.html')" style="flex: 1; background: #e2e8f0; color: #1e3a8a; border: 1.5px solid #94a3b8; border-radius: 4px; padding: 7px; font-weight: bold; cursor: pointer; font-size: 11px;">العودة للخدمات</button>
            </div>

        </div>

    </div>

    <!-- Firebase والسكربت البرمجي -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC-E9VX8n8ytdBh-xJvU9T94tgayv91O24",
            authDomain: "library-catalog-5d1ee.firebaseapp.com",
            databaseURL: "https://library-catalog-5d1ee-default-rtdb.firebaseio.com",
            projectId: "library-catalog-5d1ee",
            storageBucket: "library-catalog-5d1ee.firebasestorage.app",
            messagingSenderId: "208558639650",
            appId: "1:208558639650:web:564ef91d341bbb23ef587b",
            measurementId: "G-BHYSZHJLTR"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserUid = "";

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserUid = user.uid;
                if(!document.getElementById('email').value) {
                    document.getElementById('email').value = user.email || '';
                }
            } else {
                window.location.href = 'login.html';
            }
        });

        window.submitSubscription = async function() {
            const fullName = document.getElementById('fullName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const email = document.getElementById('email').value.trim();
            const department = document.getElementById('department').value;
            const contentType = document.getElementById('contentType').value;
            const notificationChannel = document.getElementById('notificationChannel').value;
            const interests = document.getElementById('interests').value.trim();
            const btn = document.getElementById('submitBtn');

            if (!fullName || !phone || !email || !department) {
                alert('الرجاء تعبئة الحقول الأساسية المطلوبة.');
                return;
            }

            try {
                btn.disabled = true;
                btn.innerText = "جاري الإرسال...";

                await addDoc(collection(db, "selective_requests"), {
                    uid: currentUserUid,
                    fullName: fullName,
                    phone: phone,
                    email: email,
                    department: department,
                    contentType: contentType,
                    notificationChannel: notificationChannel,
                    interests: interests,
                    type: "بث انتقائي (SDI)",
                    status: "pending",
                    createdAt: new Date()
                });

                alert('تم إرسال طلب الاشتراك في خدمة البث الانتقائي (SDI) بنجاح!');
                
                document.getElementById('fullName').value = '';
                document.getElementById('phone').value = '';
                document.getElementById('interests').value = '';
                document.getElementById('department').selectedIndex = 0;
                document.getElementById('contentType').selectedIndex = 0;
                document.getElementById('notificationChannel').selectedIndex = 0;

            } catch (error) {
                console.error("خطأ في إرسال الطلب:", error);
                alert('حدث خطأ أثناء إرسال الطلب، يرجى المحاولة لاحقاً.');
            } finally {
                btn.disabled = false;
                btn.innerText = "إشتراك في الخدمة";
            }
        }

        window.navigateTo = function(pageUrl) {
            window.location.href = pageUrl;
        }
    </script>
</body>
</html>
