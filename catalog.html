<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة كلية علوم الحاسوب</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f1f5f9; font-family: Tahoma, sans-serif;">

    <div style="display: flex; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; min-height: 100vh;">
        
        <div style="width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 15px;">
            
            <!-- أزرار التبديل بين الكتب والرسائل الجامعية -->
            <div style="background: white; padding: 12px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; gap: 10px;">
                <button id="btnBooks" onclick="switchTab('books')" style="flex: 1; background: #3b82f6; color: white; border: none; border-radius: 8px; padding: 10px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s;">📚 الكتب</button>
                <button id="btnTheses" onclick="switchTab('theses')" style="flex: 1; background: #e2e8f0; color: #475569; border: none; border-radius: 8px; padding: 10px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s;">🎓 الرسائل الجامعية</button>
            </div>

            <!-- حاوية عرض النتائج -->
            <div id="contentContainer" style="display: flex; flex-direction: column; gap: 12px;">
                <div style="text-align: center; color: #64748b; padding: 20px;">جاري التحميل...</div>
            </div>

        </div>
    </div>

    <!-- النافذة المنبثقة العامة (Modal) -->
    <div id="customModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; z-index: 1000;">
        <div style="background: white; width: 100%; max-width: 400px; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); position: relative;">
            <h3 id="modalTitle" style="margin: 0; color: #1f2937; font-size: 18px; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px;"></h3>
            <div id="modalBody" style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #4b5563;"></div>
            <div id="modalFooter" style="display: flex; gap: 10px; margin-top: 10px;"></div>
        </div>
    </div>

    <!-- كود الجافاسكريبت -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC-E9VX8n8ytdBh-xJvU9T94tgayv91O24",
            authDomain: "library-catalog-5d1ee.firebaseapp.com",
            databaseURL: "https://library-catalog-5d1ee-default-rtdb.firebaseio.com",
            projectId: "library-catalog-5d1ee",
            storageBucket: "library-catalog-5d1ee.firebasestorage.app",
            messagingSenderId: "208558639650",
            appId: "1:208558639650:web:564ef91d341bbb23ef587b",
            measurementId: "G-BHYSZHJLTR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentTab = 'books';

        window.switchTab = function(tab) {
            currentTab = tab;
            const btnBooks = document.getElementById('btnBooks');
            const btnTheses = document.getElementById('btnTheses');

            if (tab === 'books') {
                btnBooks.style.background = '#3b82f6';
                btnBooks.style.color = 'white';
                btnTheses.style.background = '#e2e8f0';
                btnTheses.style.color = '#475569';
                loadBooks();
            } else {
                btnTheses.style.background = '#3b82f6';
                btnTheses.style.color = 'white';
                btnBooks.style.background = '#e2e8f0';
                btnBooks.style.color = '#475569';
                loadTheses();
            }
        }

        async function loadBooks() {
            const container = document.getElementById('contentContainer');
            container.innerHTML = '<div style="text-align: center; color: #64748b; padding: 20px;">جاري تحميل الكتب...</div>';

            try {
                const querySnapshot = await getDocs(collection(db, "books"));
                
                if (querySnapshot.empty) {
                    container.innerHTML = '<div style="text-align: center; color: #64748b; padding: 20px; background: white; border-radius: 10px;">لا توجد كتب مسجلة حالياً.</div>';
                    return;
                }

                container.innerHTML = '';
                querySnapshot.forEach((docSnap) => {
                    const book = docSnap.data();
                    const title = book.title || 'بدون عنوان';
                    const author = book.author || book.fullname || book.authorName || book.authorId || 'مؤلف غير معروف';
                    const department = book.department || 'القسم غير محدد';
                    const publisher = book.publisher || 'غير معروف';
                    const copiesCount = book.copiesCount !== undefined ? book.copiesCount : 'غير متوفر';
                    const edition = book.edition || 'غير متوفرة';
                    const isbn = book.isbn || 'غير متوفر';

                    const card = document.createElement('div');
                    card.style.cssText = "background: white; padding: 16px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-right: 4px solid #3b82f6; display: flex; flex-direction: column; gap: 6px; cursor: pointer;";
                    
                    card.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <span style="font-size: 11px; color: #2563eb; font-weight: bold;">📚 كتاب (${department})</span>
                            <span style="font-size: 11px; color: #64748b; background: #f1f5f9; padding: 2px 6px; border-radius: 4px;">نسخ: ${copiesCount}</span>
                        </div>
                        <div style="font-size: 15px; font-weight: bold; color: #1f2937;">${title}</div>
                        <div style="font-size: 13px; color: #4b5563;">المؤلف: <strong>${author}</strong></div>
                        <div style="font-size: 13px; color: #6b7280;">دار النشر: ${publisher}</div>
                    `;

                    card.onclick = () => {
                        openModal(
                            title,
                            `
                            <div><strong>المؤلف:</strong> ${author}</div>
                            <div><strong>القسم:</strong> ${department}</div>
                            <div><strong>دار النشر:</strong> ${publisher}</div>
                            <div><strong>الطبعة:</strong> ${edition}</div>
                            <div><strong>الرقم المعياري (ISBN):</strong> ${isbn}</div>
                            <div><strong>عدد النسخ المتاحة:</strong> ${copiesCount}</div>
                            `,
                            [
                                { text: "طلب الإعارة", bg: "#10b981", color: "white", action: () => { window.location.href = 'loans.html'; } },
                                { text: "إغلاق", bg: "#e2e8f0", color: "#475569", action: closeModal }
                            ]
                        );
                    };

                    container.appendChild(card);
                });
            } catch (error) {
                console.error(error);
                container.innerHTML = '<div style="text-align: center; color: #ef4444; padding: 20px; background: white; border-radius: 10px;">حدث خطأ أثناء جلب الكتب.</div>';
            }
        }

        async function loadTheses() {
            const container = document.getElementById('contentContainer');
            container.innerHTML = '<div style="text-align: center; color: #64748b; padding: 20px;">جاري تحميل الرسائل...</div>';

            try {
                const querySnapshot = await getDocs(collection(db, "theses"));
                
                if (querySnapshot.empty) {
                    container.innerHTML = '<div style="text-align: center; color: #64748b; padding: 20px; background: white; border-radius: 10px;">لا توجد رسائل جامعية مسجلة حالياً.</div>';
                    return;
                }

                container.innerHTML = '';

                for (const docSnap of querySnapshot.docs) {
                    const thesis = docSnap.data();
                    
                    const title = thesis.title || 'بدون عنوان';
                    const department = thesis.department || 'القسم غير محدد';
                    const degree = thesis.degree || '';
                    const publicationYear = thesis.publicationYear || '';
                    const summary = thesis.summary || 'لا يوجد ملخص متاحة.';

                    // قيم افتراضية مبدئية من وثيقة الرسالة مباشرة إن وجدت
                    let authorName = thesis.fullname || thesis.authorName || thesis.author || 'باحث غير معروف';
                    let studentId = thesis.studentId || thesis.student_id || 'غير متوفر';

                    // محاولة جلب المعرف المرتبط بمجموعة authors بأي اسم محتمل للحقل
                    const authorIdRef = thesis.authorId || thesis.author || thesis.author_id || thesis.authorRef || thesis.writerId || thesis.studentId;

                    if (authorIdRef) {
                        try {
                            const authorDocRef = doc(db, "authors", String(authorIdRef));
                            const authorDocSnap = await getDoc(authorDocRef);
                            if (authorDocSnap.exists()) {
                                const authorData = authorDocSnap.data();
                                authorName = authorData.fullname || authorName;
                                studentId = authorData.studentId || studentId;
                            }
                        } catch (err) {
                            console.log("خطأ في جلب المؤلف عبر المعرف:", err);
                        }
                    }

                    // إذا لم يتم العثور على الاسم وكان المعرف غير كافٍ، نقوم بالبحث داخل مجموعة authors برقم الطالب أو بمعرف المستند نفسه
                    if (authorName === 'باحث غير معروف' || studentId === 'غير متوفر') {
                        try {
                            const authorsSnapshot = await getDocs(collection(db, "authors"));
                            authorsSnapshot.forEach(authDoc => {
                                const authData = authDoc.data();
                                // مطابقة الوثيقة في authors إما عبر معرف المستند أو الحقول الداخلية
                                if (authDoc.id === authorIdRef || authData.studentId === thesis.studentId || authDoc.id === docSnap.id) {
                                    if (authData.fullname) authorName = authData.fullname;
                                    if (authData.studentId) studentId = authData.studentId;
                                }
                            });
                        } catch (e) {
                            console.log("خطأ في البحث الاحتياطي بالمؤلفين:", e);
                        }
                    }

                    const card = document.createElement('div');
                    card.style.cssText = "background: white; padding: 16px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-right: 4px solid #f59e0b; display: flex; flex-direction: column; gap: 6px; cursor: pointer;";
                    
                    card.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <span style="font-size: 11px; color: #d97706; font-weight: bold;">🎓 رسالة جامعية (${department} - ${degree})</span>
                            <span style="font-size: 11px; color: #64748b; background: #f1f5f9; padding: 2px 6px; border-radius: 4px;">${publicationYear}</span>
                        </div>
                        <div style="font-size: 15px; font-weight: bold; color: #1f2937;">${title}</div>
                        <div style="font-size: 13px; color: #4b5563;">الباحث: <strong>${authorName}</strong></div>
                        <div style="font-size: 13px; color: #6b7280;">الرقم الجامعي: <strong>${studentId}</strong></div>
                    `;

                    card.onclick = () => {
                        openModal(
                            title,
                            `
                            <div><strong>الباحث:</strong> ${authorName}</div>
                            <div><strong>الرقم الجامعي:</strong> ${studentId}</div>
                            <div><strong>الدرجة العلمية:</strong> ${degree} (${department})</div>
                            <div><strong>سنة النشر:</strong> ${publicationYear}</div>
                            <div style="margin-top: 5px; background: #f8fafc; padding: 8px; border-radius: 6px;"><strong>الملخص:</strong><br>${summary}</div>
                            `,
                            [
                                { text: "الاطلاع عليها", bg: "#3b82f6", color: "white", action: () => { alert("جاري فتح محتوى الرسالة للاطلاع..."); } },
                                { text: "إغلاق", bg: "#e2e8f0", color: "#475569", action: closeModal }
                            ]
                        );
                    };

                    container.appendChild(card);
                }
            } catch (error) {
                console.error(error);
                container.innerHTML = '<div style="text-align: center; color: #ef4444; padding: 20px; background: white; border-radius: 10px;">حدث خطأ أثناء جلب الرسائل.</div>';
            }
        }

        window.openModal = function(title, htmlBody, buttons) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerHTML = htmlBody;
            
            const footer = document.getElementById('modalFooter');
            footer.innerHTML = '';
            
            buttons.forEach(btnInfo => {
                const b = document.createElement('button');
                b.innerText = btnInfo.text;
                b.style.cssText = `flex: 1; background: ${btnInfo.bg}; color: ${btnInfo.color}; border: none; border-radius: 6px; padding: 10px; font-weight: bold; cursor: pointer; font-size: 13px;`;
                b.onclick = btnInfo.action;
                footer.appendChild(b);
            });

            document.getElementById('customModal').style.display = 'flex';
        }

        window.closeModal = function() {
            document.getElementById('customModal').style.display = 'none';
        }

        loadBooks();
    </script>
</body>
</html>
