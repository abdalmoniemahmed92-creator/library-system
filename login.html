<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول للفهرس الإلكتروني - كلية علوم الحاسوب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            direction: rtl;
        }
        .login-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 15px;
        }
        .login-btn {
            background: #3498db;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        .login-btn:hover {
            background: #2980b9;
        }
        .register-link {
            text-align: center;
            margin-top: 15px;
        }
        .register-link a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
        .error-msg {
            color: #e74c3c;
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>تسجيل الدخول للفهرس الإلكتروني لكلية علوم الحاسوب</h2>
        <div id="errorMsg" class="error-msg"></div>
        
        <div>
            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="example@domain.com">
            </div>
            
            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" placeholder="********">
            </div>
            
            <button type="button" class="login-btn" id="submitBtn" onclick="handleLogin()">دخول</button>
        </div>

        <div class="register-link">
            ليس لديك حساب؟ <a href="register.html">تسجيل جديد</a>
        </div>
    </div>

    <!-- استدعاء المكتبات بخاصية async لتحميلها بسلاسة دون تجميد التطبيق -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js" async></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js" async></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js" async></script>

    <script>
        // الانتظار حتى تحميل مكتبات الفايربيس تماماً لتجنب أي تعليق
        window.addEventListener('DOMContentLoaded', () => {
            const firebaseConfig = {
                apiKey: "AIzaSyC-E9VX8n8ytdBh-xJvU9T94tgayv91O24",
                authDomain: "library-catalog-5d1ee.firebaseapp.com",
                databaseURL: "https://library-catalog-5d1ee-default-rtdb.firebaseio.com",
                projectId: "library-catalog-5d1ee",
                storageBucket: "library-catalog-5d1ee.firebasestorage.app",
                messagingSenderId: "208558639650",
                appId: "1:208558639650:web:564ef91d341bbb23ef587b",
                measurementId: "G-BHYSZHJLTR"
            };

            // التحقق من عدم تهيئة التطبيق مسبقاً لتفادي الأخطاء والثقل
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
        });

        async function handleLogin() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const errorDiv = document.getElementById("errorMsg");
            errorDiv.textContent = "";

            if (!email || !password) {
                errorDiv.textContent = "يرجى إدخال البريد الإلكتروني وكلمة المرور.";
                return;
            }

            const btn = document.getElementById("submitBtn");
            btn.textContent = "جاري الدخول...";
            btn.disabled = true;

            try {
                const auth = firebase.auth();
                const db = firebase.firestore();

                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;

                const userDoc = await db.collection("uid").doc(user.uid).get();

                if (userDoc.exists) {
                    const userData = userDoc.data();
                    if (userData.type === "admin" || userData.type === "مشرف" || userData.type === "مدير") {
                        window.location.href = "admin-home.html";
                    } else {
                        window.location.href = "home.html";
                    }
                } else {
                    errorDiv.textContent = "بيانات الحساب غير موجودة في قاعدة البيانات.";
                    btn.textContent = "دخول";
                    btn.disabled = false;
                }
            } catch (error) {
                console.error("خطأ:", error);
                errorDiv.textContent = "خطأ في البريد الإلكتروني أو كلمة المرور.";
                btn.textContent = "دخول";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
