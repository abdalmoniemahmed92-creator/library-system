<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول للفهرس الإلكتروني - كلية علوم الحاسوب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            direction: rtl;
        }
        .login-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 15px;
        }
        .actions-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .login-btn {
            background: #3498db;
            color: white;
            border: none;
            flex: 1;
            padding: 12px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
        }
        .login-btn:hover {
            background: #2980b9;
        }
        .register-btn {
            background: #e2e8f0;
            color: #334155;
            border: 1px solid #cbd5e1;
            flex: 1;
            padding: 12px;
            border-radius: 5px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s;
        }
        .register-btn:hover {
            background: #cbd5e1;
        }
        .error-msg {
            color: #e74c3c;
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>تسجيل الدخول للفهرس الإلكتروني لكلية علوم الحاسوب</h2>
        <div id="errorMsg" class="error-msg"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" required placeholder="example@domain.com">
            </div>
            
            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" required placeholder="********">
            </div>
            
            <div class="actions-container">
                <button type="submit" class="login-btn" id="submitBtn">دخول</button>
                <a href="register.html" class="register-btn">تسجيل جديد</a>
            </div>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, addDoc, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC-E9VX8n8ytdBh-xJvU9T94tgayv91O24",
            authDomain: "library-catalog-5d1ee.firebaseapp.com",
            databaseURL: "https://library-catalog-5d1ee-default-rtdb.firebaseio.com",
            projectId: "library-catalog-5d1ee",
            storageBucket: "library-catalog-5d1ee.firebasestorage.app",
            messagingSenderId: "208558639650",
            appId: "1:208558639650:web:564ef91d341bbb23ef587b",
            measurementId: "G-BHYSZHJLTR"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // دالة مساعدة لتسجيل وقت الدخول في الجدول المنفصل student_sessions
        async function recordStudentLogin(userEmail) {
            try {
                let studentId = "";
                // البحث عن الرقم الجامعي للطالب في المجموعات المحتملة
                const collectionsToCheck = ["student", "students", "users", "uid", "loans"];
                
                for (const col of collectionsToCheck) {
                    const q = query(collection(db, col), where("email", "==", userEmail));
                    const querySnapshot = await getDocs(q);
                    if (!querySnapshot.empty) {
                        querySnapshot.forEach((docSnap) => {
                            const data = docSnap.data();
                            studentId = data.studentId || data.universityId || data.idNumber || "";
                        });
                        if (studentId) break;
                    }
                }

                // إنشاء سجل جديد في جدول student_sessions يحتوي على وقت الضغطة الحالي
                await addDoc(collection(db, "student_sessions"), {
                    studentId: studentId || "غير محدد",
                    email: userEmail,
                    loginTime: serverTimestamp(), // الوقت والتاريخ الحالي بالضغطة
                    logoutTime: "", // يترك فارغاً لكي يظهر في لوحة التحكم كـ "نشط الآن"
                    services: "تسجيل الدخول واستعراض الكتالوج"
                });
            } catch (error) {
                console.error("خطأ أثناء حفظ زمن الدخول:", error);
            }
        }

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const errorDiv = document.getElementById("errorMsg");
            errorDiv.textContent = "";

            try {
                // 1. تسجيل الدخول عبر Firebase Auth
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 2. تسجيل زمن الدخول تلقائياً في الجدول المنفصل عند الضغطة
                await recordStudentLogin(email);

                // 3. جلب بيانات نوع المستخدم وتوجيهه للصفحة المناسبة
                const userDocRef = doc(db, "uid", user.uid);
                const userDoc = await getDoc(userDocRef);

                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    const userType = userData.type;
                    
                    if (userType === "admin" || userType === "مشرف" || userType === "مدير") {
                        window.location.href = "admin-home.html";
                    } else if (userType === "باحث") {
                        window.location.href = "researcher-home.html";
                    } else {
                        window.location.href = "home.html";
                    }
                } else {
                    errorDiv.textContent = "بيانات الحساب غير موجودة في مجموعة uid.";
                }
            } catch (error) {
                console.error("خطأ في تسجيل الدخول:", error);
                errorDiv.textContent = "خطأ في البريد الإلكتروني أو كلمة المرور.";
            }
        });
    </script>
</body>
</html>
